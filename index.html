<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieMatch Food Pairing - Live Demo</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at 20% 20%, #7b2cff 0%, #1a0b2a 55%, #05030a 100%);
  color: #fff;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 40px;
  padding: 40px 20px;
  background: linear-gradient(135deg, rgba(123, 44, 255, 0.35), rgba(255, 20, 147, 0.15));
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 12px 50px rgba(123, 44, 255, 0.35);
}

h1 {
  font-size: 3rem;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #ff1de0 0%, #7b2cff 50%, #00d4ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  color: rgba(255, 255, 255, 0.75);
  font-size: 1.1rem;
}

.demo-section {
  background: rgba(10, 5, 20, 0.65);
  border-radius: 16px;
  padding: 30px;
  margin-bottom: 30px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

.movie-input {
  margin-bottom: 30px;
}

label {
  display: block;
  margin-bottom: 10px;
  color: #ff1de0;
  font-weight: 700;
}

select, input {
  width: 100%;
  padding: 12px;
  background: rgba(20, 10, 40, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  outline: none;
}

select:focus, input:focus {
  border-color: #ff1de0;
  box-shadow: 0 0 12px rgba(255, 29, 224, 0.45);
}

.arousal-display {
  margin: 30px 0;
  text-align: center;
}

.arousal-bar-container {
  background: rgba(255, 255, 255, 0.08);
  height: 40px;
  border-radius: 20px;
  overflow: hidden;
  margin: 20px 0;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.arousal-bar {
  height: 100%;
  background: linear-gradient(90deg, #7b2cff 0%, #ff1de0 50%, #00d4ff 100%);
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: rgba(0, 0, 0, 0.8);
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.25);
}

.spice-level {
  display: inline-block;
  padding: 12px 24px;
  background: linear-gradient(135deg, #ff1de0 0%, #7b2cff 100%);
  color: #000;
  border-radius: 24px;
  font-weight: 800;
  font-size: 1.2rem;
  margin: 20px 0;
  box-shadow: 0 8px 25px rgba(255, 29, 224, 0.35);
}

.food-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.food-card {
  background: rgba(20, 10, 40, 0.85);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.food-card:hover {
  transform: translateY(-4px);
  border-color: #ff1de0;
  box-shadow: 0 10px 30px rgba(255, 29, 224, 0.25);
}

.food-card h3 {
  color: #ff1de0;
  font-size: 0.9rem;
  text-transform: uppercase;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.food-card li {
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  color: #ddd;
}

.food-card li:last-child {
  border-bottom: none;
}

.research-badge {
  background: rgba(20, 10, 40, 0.75);
  padding: 20px;
  border-radius: 12px;
  margin-top: 30px;
  text-align: center;
  border-left: 4px solid #ff1de0;
}

.research-badge p {
  color: rgba(255, 255, 255, 0.75);
  font-size: 0.9rem;
  font-style: italic;
}

.research-badge a {
  color: #00d4ff;
  text-decoration: none;
  font-weight: 700;
}

.research-badge a:hover {
  text-decoration: underline;
}

.example-movies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-top: 20px;
}

.example-movie {
  background: rgba(20, 10, 40, 0.85);
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid rgba(255, 255, 255, 0.08);
}

.example-movie:hover {
  border-color: #ff1de0;
  transform: scale(1.05);
}

.example-movie .emoji {
  font-size: 2rem;
  display: block;
  margin-bottom: 8px;
}

@media (max-width: 768px) {
  h1 {
    font-size: 2rem;
  }
  .food-grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎬🍽️ MovieMatch & SensoryMatch</h1>
    <p class="subtitle">Discover movies you'll both love and food you'll both enjoy.</p>
  </header>

  <div class="demo-section">
    <h2>Try It Out</h2>

    <!-- MOVIE SEARCH -->
    <div class="movie-input">
      <label>Search for a Movie:</label>
      <input type="text" id="movieSearch"
        placeholder="Type a movie title and press Enter"
        onkeydown="if (event.key === 'Enter') searchMovie()"
      />
    </div>

    <div class="movie-input">
      <label>Select a Movie Genre:</label>
      <select id="genreSelect" onchange="updatePairing()">
        <option value="30">Action / Thriller</option>
        <option value="25">Adventure</option>
        <option value="20">Science Fiction</option>
        <option value="15">Comedy</option>
        <option value="10">Fantasy</option>
        <option value="5">Drama</option>
        <option value="0">Romance</option>
      </select>
    </div>

    <p style="color:#999;">Or try these popular movies:</p>
    <div class="example-movies">
      <div class="example-movie" onclick="setMovie('Mad Max: Fury Road', 92)">
        <span class="emoji">💥</span><strong>Mad Max</strong>
      </div>
      <div class="example-movie" onclick="setMovie('John Wick', 82)">
        <span class="emoji">🔫</span><strong>John Wick</strong>
      </div>
      <div class="example-movie" onclick="setMovie('The Notebook', 8)">
        <span class="emoji">💕</span><strong>The Notebook</strong>
      </div>
      <div class="example-movie" onclick="setMovie('Inception', 65)">
        <span class="emoji">🌀</span><strong>Inception</strong>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <h2>Recommendation for: <span id="movieTitle">Action Movie</span></h2>

    <div class="arousal-display">
      <div class="arousal-bar-container">
        <div class="arousal-bar" id="arousalBar">
          <span id="arousalText">30/100</span>
        </div>
      </div>
      <div class="spice-level" id="spiceLevel">🌶️ Mild</div>
    </div>

    <h3 style="color:#1DB954;">Recommended Foods:</h3>
    <div class="food-grid" id="foodGrid"></div>
  </div>
</div>

<!-- Sensory Logic -->
<script src="sensoryPairing.js"></script>

<script>
const API_KEY = "598543d";

async function searchMovie() {
  const query = document.getElementById("movieSearch").value.trim();
  if (!query) return;

  const url = `https://www.omdbapi.com/?t=${encodeURIComponent(query)}&apikey=${API_KEY}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.Response === "False") {
      alert("Movie not found");
      return;
    }

    const arousalScore = inferArousalFromOMDb(data);
    displayPairing(data.Title, arousalScore);
  } catch (err) {
    console.error(err);
    alert("Error fetching movie data");
  }
}

function inferArousalFromOMDb(movie) {
  let score = 20;
  const genres = (movie.Genre || "").split(", ");

  if (genres.includes("Action")) score += 30;
  if (genres.includes("Thriller")) score += 25;
  if (genres.includes("Horror")) score += 35;
  if (genres.includes("Sci-Fi")) score += 20;
  if (genres.includes("Comedy")) score += 10;
  if (genres.includes("Romance")) score -= 10;
  if (genres.includes("Drama")) score -= 5;

  const rating = parseFloat(movie.imdbRating);
  if (!isNaN(rating)) score += rating * 2;

  return Math.max(0, Math.min(100, Math.round(score)));
}

// Genre picker
function updatePairing() {
  const genreScore = parseInt(document.getElementById('genreSelect').value);
  const arousalScore = genreScore + Math.floor(Math.random() * 20) + 10;
  displayPairing('Selected Movie', arousalScore);
}

function setMovie(title, score) {
  displayPairing(title, score);
}

// Default
displayPairing('Action Movie', 30);
</script>
</body>
</html>
