<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensoryMatch Live Demo</title>
    <style>
        /* --- styles unchanged --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000; color: #fff; padding: 20px; min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            text-align: center; margin-bottom: 40px; padding: 40px 20px;
            background: linear-gradient(135deg, rgba(239,68,68,.1), rgba(168,85,247,.1));
            border-radius: 20px; border: 1px solid rgba(239,68,68,.2);
        }
        h1 {
            font-size: 3rem; margin-bottom: 10px;
            background: linear-gradient(135deg, #ef4444, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { color: #999; font-size: 1.2rem; }
        .demo-section {
            background: #18181b; border-radius: 20px;
            padding: 40px; margin-bottom: 30px; border: 1px solid #27272a;
        }
        .movie-input { margin-bottom: 30px; }
        label {
            display: block; margin-bottom: 12px;
            color: #ef4444; font-weight: 700; font-size: 1.1rem;
        }
        select, input {
            width: 100%; padding: 16px; background: #27272a;
            border: 1px solid #3f3f46; border-radius: 12px;
            color: #fff; font-size: 1.1rem;
        }
        .example-movies {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px; margin-top: 24px;
        }
        .example-movie {
            background: #27272a; padding: 20px; border-radius: 12px;
            text-align: center; cursor: pointer; transition: .2s;
            border: 2px solid #3f3f46;
        }
        .example-movie:hover {
            border-color: #ef4444; transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(239,68,68,.2);
        }
        .intensity-bar { height: 100%; transition: .6s; border-radius: 6px; }
        .food-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
            gap: 20px; margin-top: 30px;
        }
        .food-card {
            background: rgba(39,39,42,.6);
            padding: 24px; border-radius: 16px; border: 1px solid #3f3f46;
        }
        .drink-tag {
            background: rgba(39,39,42,.7);
            border: 1px solid rgba(63,63,70,.5);
            color: #d4d4d8; padding: 8px 16px;
            border-radius: 999px; font-size: .9rem;
        }
    </style>
</head>

<body>
<div class="container">
<header>
    <h1>🎬🍽️ SensoryMatch</h1>
    <p class="subtitle">Movies you’ll love. Food your brain craves.</p>
</header>

<div class="demo-section">
    <h2 style="margin-bottom:24px;">Search a Movie</h2>

    <!-- OMDb SEARCH -->
    <div class="movie-input">
        <label>Search by Movie Title:</label>
        <input
            id="movieSearch"
            placeholder="Type a movie and press Enter…"
            onkeydown="if(event.key==='Enter') searchMovie()"
        >
    </div>

    <label>Or Select a Genre:</label>
    <select id="genreSelect" onchange="updatePairing()">
        <option value="horror">🎃 Horror</option>
        <option value="thriller">🔪 Thriller</option>
        <option value="crime">🕵️ Crime</option>
        <option value="action" selected>💥 Action</option>
        <option value="scifi">🚀 Sci-Fi</option>
        <option value="adventure">🗺️ Adventure</option>
        <option value="fantasy">🐉 Fantasy</option>
        <option value="mystery">🔍 Mystery</option>
        <option value="drama">🎭 Drama</option>
        <option value="comedy">😂 Comedy</option>
        <option value="romance">💕 Romance</option>
        <option value="family">👨‍👩‍👧‍👦 Family</option>
    </select>
</div>

<div class="demo-section">
    <h2>Food Pairing for: <span id="movieTitle" style="color:#ef4444;">Action Movie</span></h2>
    <div id="foodGrid" class="food-grid"></div>
    <div id="drinkTags" style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;"></div>
</div>
</div>

<script>
/* ---------- CONFIG ---------- */
const OMDB_API_KEY = "598543d";

/* ---------- DATA ---------- */
const GENRE_INTENSITY = {
  horror:3, thriller:2, crime:2, action:2,
  scifi:1, adventure:1, fantasy:1, mystery:1,
  drama:0, comedy:0, romance:0, family:0
};

const FOOD_DATA = {
  spiceLevels:{
    0:{name:"Comfort",emoji:"🍕",cuisines:{Comfort:["Mac & cheese","Pizza","Grilled cheese"]}},
    1:{name:"Mild Kick",emoji:"🌶️",cuisines:{Asian:["Pad Thai","Teriyaki chicken"]}},
    2:{name:"Spicy",emoji:"🔥",cuisines:{Mexican:["Tacos","Spicy wings"]}},
    3:{name:"Inferno",emoji:"💀",cuisines:{Korean:["Buldak chicken","Fire noodles"]}}
  },
  drinks:{
    0:["Hot chocolate","Tea"],
    1:["Ginger ale","Lime soda"],
    2:["Mango lassi","Iced tea"],
    3:["Milk","Coconut water"]
  }
};

/* ---------- OMDb SEARCH ---------- */
async function searchMovie() {
  const q = document.getElementById("movieSearch").value.trim();
  if (!q) return;

  const url = `https://www.omdbapi.com/?apikey=${OMDB_API_KEY}&t=${encodeURIComponent(q)}`;
  const res = await fetch(url);
  const data = await res.json();

  if (data.Response === "False") {
    alert(data.Error);
    return;
  }

  const genre = mapOMDbGenre(data.Genre);
  displayPairing(data.Title, genre);
}

function mapOMDbGenre(g="") {
  g = g.toLowerCase();
  if (g.includes("horror")) return "horror";
  if (g.includes("thriller")) return "thriller";
  if (g.includes("crime")) return "crime";
  if (g.includes("action")) return "action";
  if (g.includes("sci-fi")) return "scifi";
  if (g.includes("adventure")) return "adventure";
  if (g.includes("fantasy")) return "fantasy";
  if (g.includes("mystery")) return "mystery";
  if (g.includes("romance")) return "romance";
  if (g.includes("comedy")) return "comedy";
  if (g.includes("family")) return "family";
  return "drama";
}

/* ---------- CORE LOGIC ---------- */
function updatePairing() {
  const g = genreSelect.value;
  displayPairing(g + " movie", g);
}

function displayPairing(title, genre) {
  const level = GENRE_INTENSITY[genre] || 0;
  const food = FOOD_DATA.spiceLevels[level];
  movieTitle.textContent = title;

  foodGrid.innerHTML = "";
  Object.entries(food.cuisines).forEach(([k,v])=>{
    foodGrid.innerHTML += `
      <div class="food-card">
        <h3>${food.emoji} ${food.name}</h3>
        <ul>${v.map(d=>`<li>${d}</li>`).join("")}</ul>
      </div>`;
  });

  drinkTags.innerHTML = FOOD_DATA.drinks[level]
    .map(d=>`<span class="drink-tag">${d}</span>`).join("");
}

/* INIT */
displayPairing("Action Movie","action");
</script>
</body>
</html>
