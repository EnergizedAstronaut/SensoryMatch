<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch Food Pairing - Live Demo</title>

  <style>
    :root {
      --accent: #a020ff;
      --accent2: #ff39ff;
      --bg1: #07020c;
      --bg2: #1a0b2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, var(--bg2) 0%, var(--bg1) 60%, #000 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 20px;
      background: rgba(160, 32, 255, 0.12);
      border-radius: 16px;
      border: 1px solid rgba(160, 32, 255, 0.35);
      box-shadow: 0 0 30px rgba(160, 32, 255, 0.35);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 50%, #6c00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aaa;
      font-size: 1.1rem;
    }

    .demo-section {
      background: rgba(20, 0, 30, 0.65);
      border-radius: 16px;
      padding: 30px;
      margin-bottom: 30px;
      border: 1px solid rgba(160, 32, 255, 0.25);
      box-shadow: 0 0 18px rgba(160, 32, 255, 0.22);
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--accent);
      font-weight: 600;
    }

    select, input {
      width: 100%;
      padding: 12px;
      background: rgba(10, 0, 20, 0.8);
      border: 1px solid rgba(160, 32, 255, 0.45);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      box-shadow: 0 0 10px rgba(160, 32, 255, 0.25);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(160, 32, 255, 0.35);
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .food-card {
      background: rgba(10, 0, 20, 0.65);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(160, 32, 255, 0.35);
    }

    .food-card h3 {
      color: var(--accent);
      font-size: 0.9rem;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .food-card li {
      color: #ddd;
      padding: 8px 0;
      border-bottom: 1px solid rgba(160, 32, 255, 0.15);
    }

    .food-card li:last-child {
      border-bottom: none;
    }

    .arousal-bar-container {
      background: rgba(10, 0, 20, 0.8);
      height: 40px;
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0;
      border: 1px solid rgba(160, 32, 255, 0.3);
    }

    .arousal-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2) 0%, var(--accent) 50%, #6c00ff 100%);
      transition: width 0.8s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .spice-level {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%);
      color: #000;
      border-radius: 24px;
      font-weight: 700;
      font-size: 1.2rem;
      margin: 20px 0;
    }

    .research-badge {
      background: rgba(10, 0, 20, 0.65);
      padding: 20px;
      border-radius: 12px;
      margin-top: 30px;
      text-align: center;
      border-left: 4px solid var(--accent);
    }

    .research-badge a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>🎬🍽️ MovieMatch & SensoryMatch</h1>
      <p class="subtitle">Discover movies you'll both love and food you'll both enjoy.</p>
    </header>

    <div class="demo-section">
      <h2 style="margin-bottom: 20px;">Try It Out</h2>

      <div class="movie-input">
        <label>Search for a Movie:</label>
        <input type="text" id="movieSearch" placeholder="Type a movie title and press Enter"
               onkeydown="if (event.key === 'Enter') searchMovie()" />
      </div>

      <div class="movie-input">
        <label>Select a Movie Genre:</label>
        <select id="genreSelect" onchange="updatePairing()">
          <option value="30">Action / Thriller</option>
          <option value="25">Adventure</option>
          <option value="20">Science Fiction</option>
          <option value="15">Comedy</option>
          <option value="10">Fantasy</option>
          <option value="5">Drama</option>
          <option value="0">Romance</option>
        </select>
      </div>
    </div>

    <div class="demo-section">
      <h2 style="margin-bottom: 20px;">Recommendation for: <span id="movieTitle">Action Movie</span></h2>

      <div class="arousal-display">
        <div class="arousal-bar-container">
          <div class="arousal-bar" id="arousalBar">
            <span id="arousalText">30/100</span>
          </div>
        </div>
        <div class="spice-level" id="spiceLevel">🌶️ Mild</div>
      </div>

      <h3 style="margin: 30px 0 20px 0; color: var(--accent);">Recommended Foods:</h3>
      <div class="food-grid" id="foodGrid"></div>

      <div class="research-badge">
        <p>
          📚 Based on Penn State research
        </p>
      </div>
    </div>
  </div>

  <script src="sensoryPairing.js"></script>

  <script>
    async function searchMovie() {
      const query = document.getElementById("movieSearch").value.trim();
      if (!query) return;

      const url = `https://www.omdbapi.com/?t=${encodeURIComponent(query)}&apikey=598543d`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.Response === "False") {
          alert("Movie not found");
          return;
        }

        const arousalScore = inferArousalFromMovie(data);
        displayPairing(data.Title, arousalScore);
      } catch (err) {
        console.error(err);
        alert("Error fetching movie data (likely CORS / file://). Please run via Live Server.");
        // fallback
        updatePairing();
      }
    }

    function inferArousalFromMovie(movie) {
      let score = 20;
      const genres = movie.Genre || "";

      if (genres.includes("Action")) score += 30;
      if (genres.includes("Thriller")) score += 25;
      if (genres.includes("Horror")) score += 35;
      if (genres.includes("Sci-Fi")) score += 20;
      if (genres.includes("Comedy")) score += 10;
      if (genres.includes("Romance")) score -= 10;
      if (genres.includes("Drama")) score -= 5;

      const rating = parseFloat(movie.imdbRating);
      if (!isNaN(rating)) score += rating * 2;

      return Math.max(0, Math.min(100, Math.round(score)));
    }

    function updatePairing() {
      const genreScore = parseInt(document.getElementById('genreSelect').value);
      const arousalScore = genreScore + Math.floor(Math.random() * 20) + 10;
      displayPairing('Selected Movie', arousalScore);
    }

    function setMovie(title, score) {
      displayPairing(title, score);
    }

    function displayPairing(title, arousalScore) {
      arousalScore = Math.max(0, Math.min(100, arousalScore));
      const pairing = getSensoryPairing(arousalScore);

      document.getElementById('movieTitle').textContent = title;

      const bar = document.getElementById('arousalBar');
      const text = document.getElementById('arousalText');
      bar.style.width = arousalScore + '%';
      text.textContent = arousalScore + '/100';

      document.getElementById('spiceLevel').innerHTML =
        pairing.emoji + ' ' + pairing.name;

      const foodGrid = document.getElementById('foodGrid');
      foodGrid.innerHTML = '';

      for (const [cuisine, dishes] of Object.entries(pairing.cuisines)) {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `
          <h3>${cuisine}</h3>
          <ul>
            ${dishes.map(dish => `<li>${dish}</li>`).join('')}
          </ul>
        `;
        foodGrid.appendChild(card);
      }
    }

    displayPairing('Action Movie', 30);
  </script>
</body>
</html>
