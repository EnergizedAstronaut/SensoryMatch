<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MovieMatch Food Pairing - Live Demo</title>
  <style>
    :root {
  --accent: #a020ff;           /* neon purple */
  --accent-dark: #7b00d4;      /* deep purple */
  --accent-light: rgba(160, 32, 255, 0.18);
  --glow: rgba(160, 32, 255, 0.6);
  --glow-2: rgba(255, 59, 255, 0.45);
}

/* =========================
   Global & Body
   ========================= */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at top, #1a0b2a 0%, #07020c 60%, #000 100%);
  color: #fff;
  padding: 20px;
  min-height: 100vh;
}

/* =========================
   Main Container
   ========================= */
.container {
  max-width: 1200px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 40px;
  padding: 40px 20px;
  background: rgba(160, 32, 255, 0.12);
  border-radius: 16px;
  border: 1px solid rgba(160, 32, 255, 0.35);
  box-shadow: 0 0 30px var(--glow);
}

h1 {
  font-size: 3rem;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #ff39ff 0%, var(--accent) 40%, #6c00ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  color: #aaa;
  font-size: 1.1rem;
}

/* =========================
   Demo Sections
   ========================= */
.demo-section {
  background: rgba(20, 0, 30, 0.65);
  border-radius: 16px;
  padding: 30px;
  margin-bottom: 30px;
  border: 1px solid rgba(160, 32, 255, 0.25);
  box-shadow: 0 0 18px var(--glow);
}

label {
  display: block;
  margin-bottom: 10px;
  color: var(--accent);
  font-weight: 600;
}

select, input {
  width: 100%;
  padding: 12px;
  background: rgba(10, 0, 20, 0.8);
  border: 1px solid rgba(160, 32, 255, 0.45);
  border-radius: 8px;
  color: #fff;
  font-size: 1rem;
  box-shadow: 0 0 10px rgba(160, 32, 255, 0.25);
}

select:focus, input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 16px var(--glow);
}

/* =========================
   Arousal Bar
   ========================= */
.arousal-bar-container {
  background: rgba(10, 0, 20, 0.8);
  height: 40px;
  border-radius: 20px;
  overflow: hidden;
  margin: 20px 0;
  border: 1px solid rgba(160, 32, 255, 0.3);
}

.arousal-bar {
  height: 100%;
  background: linear-gradient(90deg, #ff39ff 0%, var(--accent) 50%, #6c00ff 100%);
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  box-shadow: 0 0 20px var(--glow);
}

.spice-level {
  display: inline-block;
  padding: 12px 24px;
  background: linear-gradient(135deg, #ff39ff 0%, var(--accent) 100%);
  color: #000;
  border-radius: 24px;
  font-weight: 700;
  font-size: 1.2rem;
  margin: 20px 0;
  box-shadow: 0 0 20px var(--glow);
}

/* =========================
   Food Cards
   ========================= */
.food-card {
  background: rgba(10, 0, 20, 0.65);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid rgba(160, 32, 255, 0.35);
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.food-card:hover {
  transform: translateY(-4px);
  border-color: #ff39ff;
  box-shadow: 0 0 16px var(--glow-2);
}

.food-card h3 {
  color: var(--accent);
  font-size: 0.9rem;
  text-transform: uppercase;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.food-card li {
  color: #ddd;
  padding: 8px 0;
  border-bottom: 1px solid rgba(160, 32, 255, 0.15);
}

.food-card li:last-child {
  border-bottom: none;
}

/* =========================
   Research Badge
   ========================= */
.research-badge {
  background: rgba(10, 0, 20, 0.65);
  padding: 20px;
  border-radius: 12px;
  margin-top: 30px;
  text-align: center;
  border-left: 4px solid var(--accent);
}

.research-badge p {
  color: #aaa;
  font-size: 0.9rem;
  font-style: italic;
}

.research-badge a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}

.research-badge a:hover {
  text-decoration: underline;
}

/* =========================
   Example Movies
   ========================= */
.example-movie {
  background: rgba(10, 0, 20, 0.65);
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  border: 2px solid transparent;
}

.example-movie:hover {
  border-color: var(--accent);
  transform: scale(1.05);
  box-shadow: 0 0 16px var(--glow);
}

.example-movie .emoji {
  font-size: 2rem;
  display: block;
  margin-bottom: 8px;
}

/* Responsive */
@media (max-width: 768px) {
  h1 {
    font-size: 2rem;
  }
  .food-grid {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬🍽️ MovieMatch & SensoryMatch</h1>
      <p class="subtitle">Discover movies you'll both love and food you'll both enjoy.</p>
    </header>

    <div class="demo-section">
      <h2 style="margin-bottom: 20px;">Try It Out</h2>

      <!-- Movie Search -->
      <div class="movie-input">
        <label>Search for a Movie:</label>
        <input
          type="text"
          id="movieSearch"
          placeholder="Type a movie title and press Enter"
          onkeydown="if (event.key === 'Enter') searchMovie()"
        />
      </div>

      <!-- Genre Dropdown -->
      <div class="movie-input">
        <label>Select a Movie Genre:</label>
        <select id="genreSelect" onchange="updatePairing()">
          <option value="30">Action / Thriller</option>
          <option value="25">Adventure</option>
          <option value="20">Science Fiction</option>
          <option value="15">Comedy</option>
          <option value="10">Fantasy</option>
          <option value="5">Drama</option>
          <option value="0">Romance</option>
        </select>
      </div>

      <p style="color: #999; margin-bottom: 20px;">Or try these popular movies:</p>
      <div class="example-movies">
        <div class="example-movie" onclick="setMovie('Mad Max: Fury Road', 92)">
          <span class="emoji">💥</span>
          <strong>Mad Max</strong>
        </div>
        <div class="example-movie" onclick="setMovie('John Wick', 82)">
          <span class="emoji">🔫</span>
          <strong>John Wick</strong>
        </div>
        <div class="example-movie" onclick="setMovie('The Notebook', 8)">
          <span class="emoji">💕</span>
          <strong>The Notebook</strong>
        </div>
        <div class="example-movie" onclick="setMovie('Inception', 65)">
          <span class="emoji">🌀</span>
          <strong>Inception</strong>
        </div>
      </div>
    </div>

    <div class="demo-section">
      <h2 style="margin-bottom: 20px;">Recommendation for: <span id="movieTitle">Action Movie</span></h2>

      <div class="arousal-display">
        <div class="arousal-bar-container">
          <div class="arousal-bar" id="arousalBar">
            <span id="arousalText">30/100</span>
          </div>
        </div>
        <div class="spice-level" id="spiceLevel">🌶️ Mild</div>
      </div>

      <h3 style="margin: 30px 0 20px 0; color: #1DB954;">Recommended Foods:</h3>
      <div class="food-grid" id="foodGrid"></div>

      <div class="research-badge">
        <p>
          📚 Based on <a href="https://pure.psu.edu/en/publications/personality-factors-predict-spicy-food-liking-and-intake" target="_blank">Penn State research</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Sensory logic -->
  <script src="sensoryPairing.js"></script>

  <!-- App logic -->
  <script>
    // Movie Search
    async function searchMovie() {
      const query = document.getElementById("movieSearch").value.trim();
      if (!query) return;

      const url = `https://www.omdbapi.com/?t=${encodeURIComponent(query)}&apikey=598543d`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.Response === "False") {
          alert("Movie not found");
          return;
        }

        const arousalScore = inferArousalFromMovie(data);
        displayPairing(data.Title, arousalScore);
      } catch (err) {
        console.error(err);
        alert("Error fetching movie data");
      }
    }

    function inferArousalFromMovie(movie) {
      let score = 20;
      const genres = movie.Genre || "";

      if (genres.includes("Action")) score += 30;
      if (genres.includes("Thriller")) score += 25;
      if (genres.includes("Horror")) score += 35;
      if (genres.includes("Sci-Fi")) score += 20;
      if (genres.includes("Comedy")) score += 10;
      if (genres.includes("Romance")) score -= 10;
      if (genres.includes("Drama")) score -= 5;

      const rating = parseFloat(movie.imdbRating);
      if (!isNaN(rating)) score += rating * 2;

      return Math.max(0, Math.min(100, Math.round(score)));
    }

    // Genre + Example movies
    function updatePairing() {
      const genreScore = parseInt(document.getElementById('genreSelect').value);
      const arousalScore = genreScore + Math.floor(Math.random() * 20) + 10;
      displayPairing('Selected Movie', arousalScore);
    }

    function setMovie(title, score) {
      displayPairing(title, score);
    }

    function displayPairing(title, arousalScore) {
      arousalScore = Math.max(0, Math.min(100, arousalScore));
      const pairing = getSensoryPairing(arousalScore);

      document.getElementById('movieTitle').textContent = title;

      const bar = document.getElementById('arousalBar');
      const text = document.getElementById('arousalText');
      bar.style.width = arousalScore + '%';
      text.textContent = arousalScore + '/100';

      document.getElementById('spiceLevel').innerHTML =
        pairing.emoji + ' ' + pairing.name;

      const foodGrid = document.getElementById('foodGrid');
      foodGrid.innerHTML = '';

      for (const [cuisine, dishes] of Object.entries(pairing.cuisines)) {
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `
          <h3>${cuisine}</h3>
          <ul>
            ${dishes.map(dish => `<li>${dish}</li>`).join('')}
          </ul>
        `;
        foodGrid.appendChild(card);
      }
    }

    displayPairing('Action Movie', 30);
  </script>
</body>
</html>
